# Internal nginx config for the frontend container itself. This only serves
# the built static SPA — it is NOT the external reverse proxy (see
# infrastructure/nginx/nginx.conf for that).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every JS/CSS/asset filename with a content hash, so a
    # changed file is always a new URL — safe to cache forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # index.html references those hashed filenames, so it must never be
        # served stale — otherwise a browser keeps loading yesterday's bundle
        # forever. no-store forces a fresh fetch on every visit.
        add_header Cache-Control "no-store" always;

        # React Router does client-side routing, so any path that doesn't
        # match a static file must fall back to index.html instead of 404ing.
        try_files $uri /index.html;
    }
}
