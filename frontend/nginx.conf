# Internal nginx config for the frontend container itself. This only serves
# the built static SPA — it is NOT the external reverse proxy (see
# infrastructure/nginx/nginx.conf for that).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router does client-side routing, so any path that doesn't
        # match a static file must fall back to index.html instead of 404ing.
        try_files $uri /index.html;
    }
}
