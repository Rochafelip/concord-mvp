# External reverse proxy / entry point (docs/ARCHITECTURE.md §24, §31,
# docs/TECH_STACK.md §23). This is distinct from the frontend container's
# own internal nginx, which only serves the built static SPA.
#
# Plain HTTP is redirected to HTTPS: browsers only allow microphone access
# (getUserMedia, needed by voice channels) in a secure context. See
# docs/DECISIONS.md D16 and the "Generating the TLS certificate" note below.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed for now (no domain yet — docs/DECISIONS.md D16). Generate with:
    #   mkdir -p infrastructure/nginx/certs
    #   openssl req -x509 -nodes -newkey rsa:2048 \
    #     -keyout infrastructure/nginx/certs/selfsigned.key \
    #     -out infrastructure/nginx/certs/selfsigned.crt \
    #     -days 3650 -subj "/CN=<VM public IP>"
    # Never commit certs/ — it holds a private key (see infrastructure/.gitignore).
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # REST API -> backend, preserving the path.
    location /api/ {
        proxy_pass http://backend:8080/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> backend. Requires the upgrade headers below, otherwise
    # the connection silently falls back to plain HTTP and real-time chat
    # breaks entirely.
    location /ws {
        proxy_pass http://backend:8080/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Without these, nginx's default 60s read/send timeout closes idle
        # WebSocket connections — very plausible for a quiet chat channel —
        # forcing constant reconnects even though nothing is actually wrong.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit signaling (WebSocket) -> the livekit service, on the same
    # origin/certificate as everything else so joining a voice channel never
    # prompts a second browser TLS-trust warning for a different host/port
    # (docs/DECISIONS.md D16). The actual RTP/RTCP media and embedded TURN
    # traffic (UDP) do NOT go through nginx — see docker-compose.yml's
    # directly published livekit ports.
    location /livekit/ {
        proxy_pass http://livekit:7880/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator (health, etc.) -> backend, reachable through the same entry
    # point for verification and any future monitoring.
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> frontend (the built static SPA).
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
