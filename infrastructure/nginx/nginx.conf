# External reverse proxy / entry point (docs/ARCHITECTURE.md §24, §31,
# docs/TECH_STACK.md §23). This is distinct from the frontend container's
# own internal nginx, which only serves the built static SPA.
server {
    listen 80;
    server_name _;

    # REST API -> backend, preserving the path.
    location /api/ {
        proxy_pass http://backend:8080/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> backend. Requires the upgrade headers below, otherwise
    # the connection silently falls back to plain HTTP and real-time chat
    # breaks entirely.
    location /ws {
        proxy_pass http://backend:8080/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator (health, etc.) -> backend, reachable through the same entry
    # point for verification and any future monitoring.
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> frontend (the built static SPA).
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
