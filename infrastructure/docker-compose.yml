services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # No host port exposed on purpose — the backend reaches Postgres over
    # the internal Docker network by service name only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Initializes the uploads volume with permissions for the non-root
  # application user used by the backend container.
  backend-init:
    image: alpine:3.20
    restart: "no"
    command: >
      sh -c "mkdir -p /uploads &&
             chown -R 1000:1000 /uploads"
    volumes:
      - backend_uploads:/uploads

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      APP_UPLOADS_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED}
      APP_BASE_URL: ${APP_BASE_URL:-https://concordmvp.duckdns.org:45678}

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  # Self-hosted LiveKit SFU (docs/ARCHITECTURE.md §19, §23; docs/DECISIONS.md D16).
  # Signaling (port 7880) is reached by nginx over the internal network only,
  # same as backend:8080 — not published on the host.
  #
  # Media (RTC UDP range, ICE/TCP fallback, embedded TURN) bypasses nginx
  # entirely and is published directly, since nginx can't proxy that traffic
  # and WebRTC media is independently encrypted (DTLS-SRTP) regardless of
  # the signaling channel's TLS.
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: --config /etc/livekit.yaml

    environment:
      # "key: secret" — see infrastructure/livekit/livekit.yaml's comment
      # on why keys are injected here rather than committed in that file.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    volumes:
      - ./livekit/livekit.local.yaml:/etc/livekit.yaml:ro
      - ./nginx/certs:/etc/livekit-certs:ro

    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "20000-20099:20000-20099/udp"
      - "22000-22099:22000-22099/udp"

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      livekit:
        condition: service_started

    ports:
      - "80:80"
      - "443:443"

      # ISPs on some residential connections block inbound 80/443 even when
      # other Port Mapping rules work fine. 45678 is the connectivity-test
      # port validated to actually reach this PC from outside, so it is reused
      # as the real public HTTPS entry point.
      - "45678:443"

  # Keeps DUCKDNS_SUBDOMAIN.duckdns.org pointed at this PC's current public IP.
  duckdns:
    image: linuxserver/duckdns:latest
    restart: unless-stopped

    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"

volumes:
  postgres_data:
  backend_uploads: