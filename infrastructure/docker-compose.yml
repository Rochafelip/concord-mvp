services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Security audit hardening (Média finding). Wrong the first time: the entrypoint starts as
    # root to chmod/chown the data dir and the /var/run/postgresql socket dir, then drops to the
    # `postgres` user via gosu — cap_drop: [ALL] alone broke all of that ("Operation not
    # permitted" on chmod, confirmed against a real deploy). CHOWN/FOWNER/DAC_OVERRIDE cover the
    # permission-fixing step, SETUID/SETGID cover the gosu drop to the postgres user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # No host port exposed on purpose — the backend reaches Postgres over
    # the internal Docker network by service name only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Initializes the uploads volume with permissions for the non-root
  # application user used by the backend container.
  backend-init:
    image: alpine:3.20
    restart: "no"
    # CHOWN/FOWNER are the two capabilities `chown` itself needs — everything else this
    # one-shot container could do is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command: >
      sh -c "mkdir -p /uploads &&
             chown -R 1000:1000 /uploads"
    volumes:
      - backend_uploads:/uploads

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped

    # Runs as a non-root user on an unprivileged port (Dockerfile's `USER app`) — no capability
    # is needed beyond what's left after dropping all of them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      # Internal Server API call (security audit A5) — reached directly by Docker service name,
      # unlike LIVEKIT_PUBLIC_URL which browser clients reach through nginx.
      LIVEKIT_SERVER_URL: http://livekit:7880
      APP_UPLOADS_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Concord}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ENABLED: ${MAIL_ENABLED}
      APP_BASE_URL: ${APP_BASE_URL:-https://${DUCKDNS_SUBDOMAIN}.duckdns.org:45678}

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

    # Runtime image is nginx:alpine (see frontend/Dockerfile), which runs its master process as
    # root to bind port 80 — NET_BIND_SERVICE is the one capability that needs to survive the drop.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Self-hosted LiveKit SFU (docs/ARCHITECTURE.md §19, §23; docs/DECISIONS.md D16).
  # Signaling (port 7880) is reached by nginx over the internal network only,
  # same as backend:8080 — not published on the host.
  #
  # Media (RTC UDP range, ICE/TCP fallback, embedded TURN) bypasses nginx
  # entirely and is published directly, since nginx can't proxy that traffic
  # and WebRTC media is independently encrypted (DTLS-SRTP) regardless of
  # the signaling channel's TLS.
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: --config /etc/livekit.yaml

    # Every port it binds (7881, 3478, 5349, the RTC UDP ranges) is unprivileged (>1024), so no
    # capability is needed beyond what's left after dropping all of them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      # "key: secret" — see infrastructure/livekit/livekit.yaml's comment
      # on why keys are injected here rather than committed in that file.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    volumes:
      - ./livekit/livekit.local.yaml:/etc/livekit.yaml:ro
      - ./nginx/certs:/etc/livekit-certs:ro

    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "20000-20099:20000-20099/udp"
      - "22000-22099:22000-22099/udp"

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    # nginx's master process runs as root to bind ports 80/443 — NET_BIND_SERVICE is the one
    # capability that needs to survive the drop.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      livekit:
        condition: service_started

    ports:
      - "80:80"
      - "443:443"

      # ISPs on some residential connections block inbound 80/443 even when
      # other Port Mapping rules work fine. 45678 is the connectivity-test
      # port validated to actually reach this PC from outside, so it is reused
      # as the real public HTTPS entry point.
      - "45678:443"

  # Keeps DUCKDNS_SUBDOMAIN.duckdns.org pointed at this PC's current public IP.
  duckdns:
    image: linuxserver/duckdns:latest
    restart: unless-stopped

    # linuxserver.io images run their own s6-overlay init as root, then drop the actual duckdns
    # process to PUID:PGID once set — same uid/gid the backend container already uses (security
    # audit, Baixa finding). No persistent volume is mounted here for it to chown, so there's
    # nothing else for that init to need root for.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      PUID: "1000"
      PGID: "1000"
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"

volumes:
  postgres_data:
  backend_uploads: