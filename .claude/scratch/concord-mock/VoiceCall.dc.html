<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    x-dc, x-dc * { box-sizing: border-box; }
    x-dc {
      display: block;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #111827;
    }
    .app { display: flex; flex-direction: column; width: 1440px; height: 900px; background: #ffffff; overflow: hidden; }
    .header { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: 8px 16px; }
    .brand { font-weight: 600; color: #111827; font-size: 16px; }
    .headerRight { display: flex; align-items: center; gap: 12px; }
    .avatar { display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .userName { font-size: 14px; color: #374151; }
    .btn { border-radius: 4px; padding: 8px 16px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .body { display: flex; flex: 1; overflow: hidden; }
    .rail { display: flex; width: 64px; flex-shrink: 0; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto; border-right: 1px solid #e5e7eb; background: #f9fafb; padding: 12px 0; }
    .railItem { display: flex; height: 48px; width: 48px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; font-size: 14px; font-weight: 600; }
    .railItem.selected { background: #4f46e5; color: #fff; }
    .railItem.idle { background: #e5e7eb; color: #374151; }
    .railAdd { display: flex; height: 48px; width: 48px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; background: #e5e7eb; color: #374151; font-size: 20px; line-height: 1; }
    .railJoin { display: flex; height: 40px; width: 40px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; background: #e5e7eb; color: #374151; font-size: 12px; font-weight: 500; }
    .channels { display: flex; width: 224px; flex-shrink: 0; flex-direction: column; border-right: 1px solid #e5e7eb; background: #f9fafb; }
    .channelsHead { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: 12px; }
    .serverName { font-weight: 600; color: #111827; font-size: 14px; }
    .gear { color: #6b7280; font-size: 14px; }
    .channelsBody { flex: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 16px; }
    .groupHead { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    .groupLabel { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #6b7280; }
    .groupAdd { font-size: 18px; line-height: 1; color: #6b7280; }
    .channelList { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; list-style: none; padding: 0; }
    .channelLink { display: flex; align-items: center; gap: 6px; border-radius: 4px; padding: 4px 8px; font-size: 14px; color: #374151; }
    .channelLink.active { background: #e0e7ff; color: #312e81; }
    .main { display: flex; min-width: 0; flex: 1; flex-direction: column; overflow: hidden; }
    .callHead { flex-shrink: 0; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; font-weight: 600; color: #111827; font-size: 14px; }
    .grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 260px 220px 220px; gap: 8px; align-content: start; }
    .tile { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; background: #1f2937; }
    .tile.screen { grid-column: span 2 / span 2; background: #111827; }
    .tileInitial { font-size: 24px; font-weight: 600; color: #f3f4f6; }
    .screenGlyph { display: flex; align-items: center; gap: 8px; color: #6b7280; font-size: 13px; }
    .badge { position: absolute; bottom: 4px; left: 4px; display: flex; align-items: center; gap: 4px; border-radius: 4px; background: rgba(0,0,0,0.5); padding: 2px 6px; font-size: 12px; color: #fff; }
    .icon { flex-shrink: 0; }
    .controls { flex-shrink: 0; display: flex; align-items: center; gap: 8px; border-top: 1px solid #e5e7eb; padding: 12px 16px; }
    .ctrlBtn { display: flex; align-items: center; gap: 6px; border-radius: 4px; background: #e5e7eb; color: #1f2937; padding: 6px 12px; font-size: 14px; border: none; }
    .ctrlBtn.leave { background: #fee2e2; color: #b91c1c; }
  </style>
</helmet>
<div class="app">
  <div class="header">
    <span class="brand">Concord</span>
    <div class="headerRight">
      <div class="avatar" style="height:32px;width:32px;">F</div>
      <span class="userName">Felipe</span>
      <button class="btn btn-secondary" type="button">Log out</button>
    </div>
  </div>

  <div class="body">
    <nav class="rail" aria-label="Servers">
      <div class="railItem selected" title="Concord HQ">C</div>
      <div class="railItem idle" title="Gaming Squad">G</div>
      <div class="railItem idle" title="Design Crew">D</div>
      <div class="railAdd" title="Create server">+</div>
      <div class="railJoin" title="Join server">Join</div>
    </nav>

    <aside class="channels">
      <div class="channelsHead">
        <span class="serverName">Concord HQ</span>
        <svg class="icon gear" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
      <div class="channelsBody">
        <div>
          <div class="groupHead">
            <h3 class="groupLabel">Text channels</h3>
            <span class="groupAdd">+</span>
          </div>
          <ul class="channelList">
            <li><span class="channelLink"><span>#</span>general</span></li>
            <li><span class="channelLink"><span>#</span>random</span></li>
            <li><span class="channelLink"><span>#</span>announcements</span></li>
          </ul>
        </div>
        <div>
          <h3 class="groupLabel">Voice channels</h3>
          <ul class="channelList">
            <li><span class="channelLink active"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>General Voice</span></li>
            <li><span class="channelLink"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>Gaming Lounge</span></li>
          </ul>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="callHead" style="display:flex;align-items:center;gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        General Voice
      </div>
      <div class="grid">
        <div class="tile screen">
          <span class="screenGlyph">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            Alex is sharing a window
          </span>
          <span class="badge"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>Alex's screen</span>
        </div>
        <div class="tile">
          <span class="tileInitial">F</span>
          <span class="badge"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>Felipe (you)</span>
        </div>
        <div class="tile">
          <span class="tileInitial">A</span>
          <span class="badge"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"></path><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>Alex</span>
        </div>
        <div class="tile">
          <span class="tileInitial">M</span>
          <span class="badge"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>Marina</span>
        </div>
        <div class="tile">
          <span class="tileInitial">S</span>
          <span class="badge"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>Sofia</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrlBtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>Mute</button>
        <button class="ctrlBtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>Camera off</button>
        <button class="ctrlBtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>Stop sharing</button>
        <button class="ctrlBtn leave" type="button">Leave</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
</body>
</html>
