<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    x-dc, x-dc * { box-sizing: border-box; }
    x-dc {
      display: block;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #111827;
    }
    a { color: #4f46e5; } a:hover { color: #6366f1; }
    .page { display: flex; align-items: center; justify-content: center; width: 900px; height: 700px; background: #f9fafb; }
    .card { display: flex; width: 384px; flex-direction: column; gap: 16px; }
    h1 { margin: 0; text-align: center; font-size: 24px; font-weight: 600; color: #111827; }
    form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 14px; font-weight: 500; color: #374151; }
    input { border-radius: 4px; border: 1px solid #d1d5db; padding: 8px 12px; font-size: 14px; color: #111827; }
    .btn { border-radius: 4px; border: none; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .foot { text-align: center; font-size: 14px; color: #4b5563; margin: 0; }
    .footLink { font-weight: 500; }
  </style>
</helmet>
<div class="page">
  <div class="card">
    <h1>Create an account</h1>
    <form>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" value="felipe">
      </div>
      <div class="field">
        <label for="displayName">Display name</label>
        <input id="displayName" type="text" value="Felipe">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" value="felipe@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" value="••••••••">
      </div>
      <button class="btn btn-primary" type="button">Register</button>
    </form>
    <p class="foot">Already have an account? <a class="footLink" href="#">Log in</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
