# Portuguese overrides for Bean Validation's built-in English messages. These strings reach the
# user verbatim through ApiError -> ErrorBanner, so they are UI copy, not internal text.
#
# The filename is fixed by the Bean Validation spec: Hibernate Validator loads this bundle by
# name with no configuration. A file named anything else -- messages.properties wired through
# spring.messages.basename, say -- is silently ignored, and the messages stay English.
jakarta.validation.constraints.NotBlank.message=é obrigatório
jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.NotEmpty.message=é obrigatório
jakarta.validation.constraints.Email.message=deve ser um e-mail válido
jakarta.validation.constraints.Size.message=deve ter entre {min} e {max} caracteres
jakarta.validation.constraints.Pattern.message=está em formato inválido
