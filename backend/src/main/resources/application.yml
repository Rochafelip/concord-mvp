server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

jwt:
  secret: ${JWT_SECRET}
  expiration-days: 30

livekit:
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  public-url: ${LIVEKIT_PUBLIC_URL}

app:
  uploads:
    dir: ${APP_UPLOADS_DIR:/app/uploads}
