server:
  port: 8080

spring:
  jackson:
    # Serializes Instant/Date fields (e.g. ApiError.timestamp) using Brazil's offset instead of
    # UTC. Frontend timestamp display is unaffected -- it already renders in the browser's own
    # local timezone via toLocaleTimeString()/toLocaleDateString(), which is offset-agnostic.
    time-zone: America/Sao_Paulo

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Explicit instead of relying on HikariCP's implicit defaults (security audit, Média
      # finding) — single self-hosted instance, single friends-group scale (docs/DECISIONS.md
      # D1), so a big pool has no upside. minimum-idle is lower than the pool max so it shrinks
      # during the long idle stretches this traffic pattern actually has; leak-detection-threshold
      # is off by default in Hikari and is turned on here since a held-open connection is exactly
      # the kind of bug that's otherwise invisible until the pool runs out.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

      # Without this, JavaMail derives Message-ID from the local hostname, which inside a
      # container is a random Docker id -- a header that looks like throwaway infrastructure.
      # Point it at the sending mailbox instead. This only feeds Message-ID generation; the
      # From header is set explicitly by MailService.
      mail.from: ${MAIL_FROM:${MAIL_USERNAME}}

jwt:
  secret: ${JWT_SECRET}
  expiration-days: 30

livekit:
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  public-url: ${LIVEKIT_PUBLIC_URL}
  # Internal Server API base URL, reached over the Docker network by service name — distinct from
  # public-url, which is what browser clients use through nginx (see docs/DECISIONS.md D16).
  server-url: ${LIVEKIT_SERVER_URL}

app:
  uploads:
    dir: ${APP_UPLOADS_DIR:/app/uploads}
    avatar-max-size: ${APP_AVATAR_MAX_SIZE:5242880}
    server-icon-max-size: ${APP_SERVER_ICON_MAX_SIZE:5242880}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    # Display name shown by mail clients. A blank one means recipients see a bare address, which
    # reads as bulk mail -- see infrastructure/EMAIL.md.
    from-name: ${MAIL_FROM_NAME:Concord}
    # Optional. Left empty, replies go to the From address.
    reply-to: ${MAIL_REPLY_TO:}
    enabled: ${MAIL_ENABLED:true}

  base-url: ${APP_BASE_URL:http://localhost:5173}
